<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sketch</title>

    <style>
      html,
      body {
        margin: 0;
        background: #e9deca;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: transparent;
      }

      #boot-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #e9deca;
      }

      .boot-loader-spinner {
        position: relative;
        z-index: 1;
        width: 34px;
        height: 34px;
        border: 2px solid rgba(83, 67, 47, 0.18);
        border-top-color: rgba(64, 51, 35, 0.72);
        border-radius: 999px;
        animation: boot-loader-spin 760ms linear infinite;
      }

      @keyframes boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
    <div id="boot-loader" aria-hidden="true">
      <span class="boot-loader-spinner"></span>
    </div>

    <div id="dom-ui-layer" aria-live="polite">
      <section id="start-page-ui" class="dom-page dom-page-start" aria-label="開始頁">
        <h1 id="start-title">匿跡蟲蹤調查員</h1>
        <p id="start-intro"></p>
        <p id="start-permission-hint">( 進入時需允許相機與動作感測器權限 )</p>
        <div id="start-permission-actions" class="permission-actions" aria-label="權限設定">
          <button id="camera-permission-action" class="ui-button permission-button" type="button">相機權限</button>
          <button id="motion-permission-action" class="ui-button permission-button" type="button">陀螺儀權限</button>
        </div>
        <p id="start-permission-status" class="permission-status" role="status"></p>
        <button id="start-action" class="ui-button ui-button-primary" type="button">啟動探索</button>
      </section>

      <section id="scanning-page-ui" class="dom-page dom-page-scanning" aria-label="掃描頁">
        <button id="shutter-action" class="shutter-button" type="button" aria-label="拍攝">
          <span class="shutter-button-inner"></span>
        </button>
      </section>

      <section id="result-page-ui" class="dom-page dom-page-result" aria-label="結果頁">
        <div id="result-toast" class="result-toast" role="status"></div>
        <div id="result-actions" class="result-actions">
          <button id="result-save-action" class="ui-button result-button" type="button">儲存</button>
          <button id="result-share-action" class="ui-button result-button" type="button">分享</button>
          <button id="result-back-action" class="ui-button result-button result-button-secondary" type="button">返回</button>
        </div>
      </section>
    </div>

    <script>
      (() => {
        const bootScripts = [
          "https://cdn.jsdelivr.net/npm/d3-delaunay@6",
          "https://cdn.jsdelivr.net/npm/p5@2.1.1/lib/p5.min.js",
          "libraries/p5.brush.js",
          "HandDrawn.js",
          "Pages/StartPage/StartPage.js",
          "Pages/pagesSettings.js",
          "Pages/ScanningPage/ScanningPageSettings.js",
          "Pages/ScanningPage/ColorProcessor.js",
          "Pages/ScanningPage/GyroManager.js",
          "Pages/ScanningPage/ShutterButton.js",
          "Pages/ScanningPage/ScanningPage.js",
          "Pages/ResultPage/ResultPageSettings.js",
          "Pages/ResultPage/InsectGenerator/InsectWings.js",
          "Pages/ResultPage/InsectGenerator/RoughWingBrushSettings.js",
          "Pages/ResultPage/InsectGenerator/RoughInsectWings.js",
          "Pages/ResultPage/InsectGenerator/RoughInsectBody.js",
          "Pages/ResultPage/InsectGenerator/InsectBody.js",
          "Pages/ResultPage/InsectGenerator/InsectManager.js",
          "Pages/ResultPage/ResultPage.js",
          "Pages/DomUi.js",
          "sketch.js"
        ];

        const waitForFirstPaint = () => new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });

        const loadScript = (src) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = false;
          script.onload = () => resolve(src);
          script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
          document.body.appendChild(script);
        });

        const startP5IfNeeded = () => {
          if (typeof window.p5 !== "function" || document.querySelector("canvas")) return;
          window.__flutterLensP5Instance = new window.p5();
        };

        const bootApp = async () => {
          window.__flutterLensBootStatus = "painting-loader";
          await waitForFirstPaint();
          window.__flutterLensBootStatus = "loading-scripts";

          for (const src of bootScripts) {
            await loadScript(src);
          }

          window.__flutterLensBootStatus = "starting-p5";
          startP5IfNeeded();
          window.__flutterLensBootStatus = "ready";
        };

        bootApp().catch((error) => {
          window.__flutterLensBootStatus = "error";
          console.error(error);
        });
      })();
    </script>
  </body>
</html>
